<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>车上存货记账</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f2f4f7; color:#222; padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
  .wrap { max-width:520px; margin:0 auto; padding:12px; }
  h1 { font-size:18px; text-align:center; padding:10px 0 4px; }
  .sub { text-align:center; font-size:12px; color:#888; margin-bottom:10px; }

  .stock-card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .stock-card h2 { font-size:14px; color:#666; margin-bottom:8px; }
  .stock-row { display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid #f0f0f0; font-size:15px; }
  .stock-row:last-child { border-bottom:none; }
  .stock-row .qty { font-weight:700; font-size:16px; text-align:right; }
  .stock-row .qty small { display:block; font-weight:400; font-size:12px; color:#999; }
  .qty.pos { color:#0a7d32; } .qty.zero { color:#aaa; } .qty.neg { color:#c0392b; }

  .panel { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .panel h3 { font-size:14px; color:#666; margin-bottom:10px; }
  .seg { display:flex; gap:8px; margin-bottom:10px; }
  .seg button { flex:1; padding:10px; border:1.5px solid #d9dce1; background:#fff; border-radius:8px; font-size:15px; font-weight:600; color:#555; }
  .seg button.on-in { background:#e8f5ee; border-color:#0a7d32; color:#0a7d32; }
  .seg button.on-out { background:#fdeeee; border-color:#c0392b; color:#c0392b; }
  .seg button.on-back { background:#e8f1fd; border-color:#1d5fd0; color:#1d5fd0; }
  .form-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  select, input { padding:10px; border:1.5px solid #d9dce1; border-radius:8px; font-size:16px; background:#fff; }
  input[type=number] { width:110px; text-align:center; }
  input[type=date] { flex:1; }
  .hint { font-size:12px; color:#999; margin-bottom:8px; }
  .add-btn { width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:700; }
  .add-btn:active { opacity:.85; }

  /* 单据多行 */
  .line-row { border:1px solid #eceef1; border-radius:10px; padding:10px; margin-bottom:10px; background:#fafbfc; }
  .line-row .r1 { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .line-row .r2 { display:flex; gap:8px; align-items:center; }
  .line-row .r2 input[type=number] { flex:1; width:auto; }
  .l-del { color:#c0392b; font-size:18px; padding:6px 8px; flex:none; }
  .unit-seg { display:flex; border:1.5px solid #d9dce1; border-radius:8px; overflow:hidden; flex:none; }
  .unit-seg button { padding:10px 12px; border:none; background:#fff; font-size:14px; font-weight:600; color:#777; }
  .unit-seg button.on { background:#2563eb; color:#fff; }
  .add-line { width:100%; padding:10px; background:#fff; border:1.5px dashed #b8c4d4; border-radius:8px; font-size:14px; color:#2563eb; font-weight:600; margin-bottom:10px; }

  /* 自动补全下拉 */
  .ac-wrap { position:relative; flex:1; width:100%; }
  .ac-list { position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid #e0e3e8; border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.14); z-index:40; max-height:250px; overflow-y:auto; }
  .ac-item { padding:10px 12px; font-size:15px; border-bottom:1px solid #f5f5f5; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item:active, .ac-item:hover { background:#f0f6ff; }
  .ac-item small { color:#999; font-size:12px; }
  .ac-create { color:#2563eb; font-weight:600; }
  .hidden { display:none !important; }

  /* 单据卡片（速览+查单共用） */
  .order-card { background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .order-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid #f0f0f0; }
  .order-head .who { font-weight:700; font-size:15px; }
  .order-head .dt { font-size:12px; color:#999; }
  .order-line { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
  .order-line .amt { font-weight:600; }
  .order-line .amt.neg { color:#c0392b; } .order-line .amt.pos { color:#0a7d32; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; font-weight:700; flex:none; margin-right:8px; }
  .tag.in { background:#e8f5ee; color:#0a7d32; }
  .tag.out { background:#fdeeee; color:#c0392b; }
  .tag.ret { background:#fff7e6; color:#b8860b; }
  .tag.back { background:#e8f1fd; color:#1d5fd0; }
  .del { color:#c0392b; font-size:20px; padding:4px 8px; }
  .empty { text-align:center; color:#aaa; font-size:14px; padding:20px 0; }

  .toolbar { display:flex; gap:8px; margin:4px 0 10px; }
  .toolbar button { flex:1; padding:8px; border:1px solid #d9dce1; background:#fff; border-radius:8px; font-size:13px; color:#555; }

  .top-actions { position:fixed; top:10px; right:12px; display:flex; gap:6px; z-index:50; }
  .top-actions button { padding:6px 10px; font-size:12px; border:1px solid #ccc; background:#fff; border-radius:6px; }

  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e5e5e5; display:flex; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:14px 0 16px; border:none; background:none; font-size:14px; color:#888; font-weight:600; }
  nav button.on { color:#2563eb; border-top:2px solid #2563eb; margin-top:-1px; }

  .sum-table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .sum-table th, .sum-table td { padding:9px 6px; text-align:center; border-bottom:1px solid #f0f0f0; }
  .sum-table th { background:#f7f8fa; color:#666; font-size:12px; }
  .sum-table td:first-child { text-align:left; }
  .sum-table td b { font-size:13px; }
  .cust-detail { font-size:12px; color:#777; line-height:1.7; text-align:left; }

  /* 盘点 */
  .pan-row { background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .pan-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .pan-head b { font-size:15px; }
  .pan-head .exp { font-size:12px; color:#999; }
  .pan-inp { display:flex; align-items:center; gap:6px; font-size:14px; color:#666; }
  .pan-inp input { width:80px; text-align:center; padding:8px; }
  .res-row { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); border-left:4px solid #ccc; }
  .res-row.ok { border-left-color:#0a7d32; }
  .res-row.bad { border-left-color:#c0392b; background:#fff7f6; }
  .res-row.more { border-left-color:#b8860b; background:#fffcf2; }
  .res-row .info { font-size:12px; color:#888; margin-top:2px; }
  .res-row .diff { font-weight:700; font-size:14px; text-align:right; }
  .pan-btns { display:flex; gap:8px; margin-top:12px; }
  .pan-btns button { flex:1; padding:12px; border:none; border-radius:8px; font-size:15px; font-weight:700; }
  .btn-fix { background:#c0392b; color:#fff; }
  .btn-back { background:#eee; color:#555; }
  .btn-redo { background:#eee; color:#555; }
  .stat-bar { display:flex; gap:6px; margin-bottom:10px; }
  .stat-bar span { flex:1; text-align:center; background:#f7f8fa; border-radius:8px; padding:8px 4px; font-size:13px; }

  #backupBar { background:#fff7e6; border:1px solid #f0d998; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:13px; color:#7a5c00; display:flex; align-items:center; gap:8px; }
  #backupBar button { padding:6px 10px; border:none; border-radius:6px; font-size:12px; font-weight:600; flex:none; }
  #backupBar .go { background:#b8860b; color:#fff; }
  #backupBar .no { background:transparent; color:#999; font-size:16px; }

  #toast { position:fixed; left:50%; bottom:140px; transform:translateX(-50%) translateY(10px); background:rgba(20,20,20,.85); color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:99; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  dialog { border:none; border-radius:12px; padding:16px; width:86%; max-width:400px; max-height:85vh; overflow-y:auto; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h4 { margin-bottom:10px; }
  dialog input { width:100%; margin-bottom:10px; }
  dialog .row { display:flex; gap:8px; }
  dialog button { flex:1; padding:10px; border-radius:8px; border:none; font-size:15px; font-weight:600; }
  dialog .fr { display:flex; gap:8px; }
  dialog .fr input[type=number]{ width:90px; }
</style>
</head>
<body>
<div class="top-actions">
  <button onclick="exportData()">导出备份</button>
  <button onclick="document.getElementById('imp').click()">导入</button>
</div>
<div class="wrap">
  <div id="backupBar" class="hidden">
    <span style="flex:1">⚠️ 已超过7天没导出备份，防丢账建议立即备份</span>
    <button class="go" onclick="exportData()">立即导出</button>
    <button class="no" onclick="dismissBackup()">×</button>
  </div>
  <h1>🚚 车上存货记账</h1>
  <div class="sub">按单记账 · 日期可查 · 盘点核对账实</div>

  <div id="page-stock">
    <div class="stock-card">
      <h2>📦 当前车上结余（账面）</h2>
      <div id="stockList"></div>
    </div>

    <div class="panel">
      <h3>➕ 记一张单</h3>
      <div class="seg">
        <button id="b-in"  onclick="setType('in')">📥 仓库拿货</button>
        <button id="b-out" onclick="setType('out')">📤 卖出</button>
        <button id="b-back" onclick="setType('back')">🏬 退仓</button>
      </div>
      <div class="form-row">
        <input type="date" id="fDate">
      </div>
      <div class="form-row" id="custRow" style="display:none">
        <div class="ac-wrap">
          <input type="text" id="fCust" placeholder="客户：输入名字选择，自动记住" autocomplete="off" style="width:100%">
          <div class="ac-list hidden" id="acCust"></div>
        </div>
      </div>
      <div id="lines"></div>
      <button class="add-line" onclick="addLine()">＋ 加一行产品</button>
      <div class="hint" id="typeHint"></div>
      <button class="add-btn" onclick="submitOrder()">确认记单</button>
    </div>

    <h3 style="font-size:14px;color:#666;margin:2px 0 8px;">📋 最近单据（点卡片修改 · 查历史去「查单」页）</h3>
    <div id="recList"></div>
  </div>

  <div id="page-find" class="hidden">
    <div class="panel">
      <h3>🔎 按日期查单</h3>
      <div class="form-row">
        <input type="date" id="qDate" onchange="renderOrders()">
      </div>
      <div id="orderList"></div>
    </div>
  </div>

  <div id="page-pan" class="hidden">
    <div class="panel" id="panPanel"></div>
  </div>

  <div id="page-sum" class="hidden">
    <div class="panel">
      <h3>📊 汇总对账表</h3>
      <table class="sum-table">
        <thead id="sumHead"></thead>
        <tbody id="sumBody"></tbody>
      </table>
      <div class="hint" style="margin-top:10px;">💡 拿货−退仓=实际从仓库带走（对仓库）；卖出−退货=实际卖给客户（对财务）。实物清点到「盘点」页核对。</div>
    </div>
    <div class="panel">
      <h3>👥 按客户汇总（累计卖出）</h3>
      <table class="sum-table">
        <thead><tr><th style="width:32%">客户</th><th>累计拿货明细</th></tr></thead>
        <tbody id="custBody"></tbody>
      </table>
    </div>
    <div class="toolbar">
      <button onclick="exportCSV()">导出Excel(CSV)</button>
      <button onclick="exportData()">导出备份</button>
    </div>
  </div>
</div>

<nav>
  <button id="nav-stock" class="on" onclick="switchPage('stock')">📝 记单</button>
  <button id="nav-find" onclick="switchPage('find')">🔎 查单</button>
  <button id="nav-pan" onclick="switchPage('pan')">🔄 盘点</button>
  <button id="nav-sum" onclick="switchPage('sum')">📊 对账</button>
</nav>

<dialog id="dlgProduct">
  <h4>新增产品</h4>
  <input type="text" id="newName" placeholder="产品名称">
  <div class="fr">
    <input type="number" id="newPer" min="1" placeholder="每件数量" inputmode="numeric">
    <input type="text" id="newUnit" placeholder="单位（包/桶/支）">
  </div>
  <div class="hint">如：A产品 每件 30 包；B产品 每件 6 桶</div>
  <div class="row">
    <button style="background:#eee;color:#555" onclick="dlgProduct.close()">取消</button>
    <button style="background:#2563eb;color:#fff" onclick="addProduct()">保存</button>
  </div>
</dialog>

<dialog id="dlgEdit">
  <h4 id="eTitle">✏️ 修改单据</h4>
  <div class="form-row"><input type="date" id="eDate"></div>
  <div class="form-row" id="eCustRow" style="display:none">
    <div class="ac-wrap">
      <input type="text" id="eCust" placeholder="客户：输入名字选择" autocomplete="off" style="width:100%">
      <div class="ac-list hidden" id="eAcCust"></div>
    </div>
  </div>
  <div id="eLines"></div>
  <button class="add-line" onclick="eAddLine()">＋ 加一行产品</button>
  <div class="hint">💡 漏记的产品点上面加一行；不想要的行点 ✕ 删掉</div>
  <div class="row">
    <button style="background:#eee;color:#555" onclick="dlgEdit.close()">取消</button>
    <button style="background:#2563eb;color:#fff" onclick="saveEditOrder()">保存修改</button>
  </div>
</dialog>

<input type="file" id="imp" accept=".json" class="hidden" onchange="importData(this)">

<script>
const KEY = 'van_stock_v2';
let state = JSON.parse(localStorage.getItem(KEY) || '{"products":[],"records":[]}');
if(!state.customers) state.customers = [];   // 兼容旧数据
let type = 'in';
let seq = 0;
const TYPE_NAME = { in:'仓库拿货', out:'卖出', back:'退仓库', ret:'客户退货', pin:'盘盈', pout:'盘亏' };
const TYPE_TAG  = { in:'in', out:'out', back:'back', ret:'ret', pin:'in', pout:'out' };
const nid = () => 'r' + Date.now() + '_' + (seq++);

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* 备份提醒：超过7天没导出备份弹横幅 */
const DISMISS_KEY = 'van_backup_dismiss';
function renderBackupBar(){
  const bar = document.getElementById('backupBar');
  const stale = state.backupAt && (Date.now() - state.backupAt > 7*86400000);
  const dismissed = localStorage.getItem(DISMISS_KEY) === todayStr();
  bar.classList.toggle('hidden', !(stale && state.records.length && !dismissed));
}
function dismissBackup(){
  localStorage.setItem(DISMISS_KEY, todayStr());
  renderBackupBar();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// 记录归属日期：单据日期优先，老记录取流水时间的日期部分
function toKey(r){
  if(r.odate) return r.odate;
  const m = (r.time||'').match(/(\d+)\/(\d+)\/(\d+)/);
  return m ? m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0') : '';
}
function fmtDateKey(k){ return k ? k.replace(/-/g,'/') : ''; }

function switchPage(p){
  ['stock','find','pan','sum'].forEach(k=>{
    document.getElementById('page-'+k).classList.toggle('hidden', k!==p);
    document.getElementById('nav-'+k).classList.toggle('on', k===p);
  });
  if(p==='sum'){ renderSum(); renderCustSum(); }
  if(p==='pan') renderPan();
  if(p==='find') renderOrders();
}

/* ---------- 自动补全 ---------- */
function bindAC(input, list, getItems, opts){
  const show = ()=>{
    const q = input.value.trim();
    let items = getItems();
    if(q) items = items.filter(i=>i.name.includes(q));
    items.sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));
    let html = items.slice(0,8).map(i=>`<div class="ac-item" data-id="${i.id}">${opts.itemHtml(i)}</div>`).join('');
    if(q) html = `<div class="ac-item ac-create" data-id="__new__">${opts.createHtml(q)}</div>` + html; // 新增行置顶，防手机键盘挡住底部
    list.innerHTML = html || `<div class="ac-item" style="color:#aaa">${opts.emptyText}</div>`;
    list.classList.remove('hidden');
  };
  const hide = ()=> list.classList.add('hidden');
  input.addEventListener('focus', ()=>{
    show();
    // 等手机键盘弹起后，把输入框滚到屏幕中部，避免建议列表被键盘挡住
    clearTimeout(input._sh);
    input._sh = setTimeout(()=>input.scrollIntoView({block:'center', behavior:'smooth'}), 350);
  });
  input.addEventListener('input', ()=>{ opts.onEdit(input); show(); });
  input.addEventListener('blur', ()=> setTimeout(hide, 150));
  list.addEventListener('mousedown', e=>{
    e.preventDefault();
    const it = e.target.closest('.ac-item'); if(!it) return;
    hide();
    if(it.dataset.id==='__new__') opts.onCreate(input.value.trim(), input, list);
    else opts.onPick(it.dataset.id, input, list);
  });
}

const cInput = document.getElementById('fCust'), cList = document.getElementById('acCust');
let selCustomer = null;
function useCustomer(name){
  let c = state.customers.find(x=>x.name===name);
  if(!c){ c = { id:'c'+Date.now(), name, lastUsed:Date.now() }; state.customers.push(c); save(); }
  selCustomer = c; cInput.value = name;
}
bindAC(cInput, cList, ()=>state.customers, {
  itemHtml: c=>`🏪 ${c.name}`,
  createHtml: q=>`➕ 使用新客户「${q}」`,
  emptyText: '还没有客户，输入名字自动记住',
  onEdit: ()=>{ selCustomer = null; },
  onPick: (id)=>{
    selCustomer = state.customers.find(c=>c.id===id);
    if(selCustomer){ selCustomer.lastUsed = Date.now(); cInput.value = selCustomer.name; save(); }
  },
  onCreate: q=>{ if(q) useCustomer(q); }
});

/* ---------- 单据多行 ---------- */
let lineSeq = 0;
function addLine(){
  const id = 'L' + (lineSeq++);
  const div = document.createElement('div');
  div.className = 'line-row';
  div.dataset.lid = id;
  div.innerHTML = `
    <div class="r1">
      <div class="ac-wrap">
        <input type="text" class="l-prod" placeholder="产品：输入名字选择" autocomplete="off" style="width:100%">
        <div class="ac-list hidden"></div>
      </div>
      <span class="l-del" onclick="delLine(this)">✕</span>
    </div>
    <div class="r2">
      <input type="number" class="l-qty" min="1" placeholder="数量" inputmode="numeric">
      <div class="unit-seg">
        <button type="button" class="l-case on" onclick="setLineUnit(this,'case')">件</button>
        <button type="button" class="l-unit" onclick="setLineUnit(this,'unit')">包</button>
      </div>
    </div>`;
  document.getElementById('lines').appendChild(div);
  const pInput = div.querySelector('.l-prod'), pList = div.querySelector('.ac-list');
  bindAC(pInput, pList, ()=>state.products, {
    itemHtml: p=>`${p.name} <small>1件=${p.perCase}${p.unitName}</small>`,
    createHtml: q=>`➕ 新增产品「${q}」`,
    emptyText: '还没有产品，输入名称即可新增',
    onEdit: (inp)=>{ div.dataset.pid = ''; },
    onPick: (pid, inp)=>{
      const p = state.products.find(x=>x.id===pid);
      if(p){
        p.lastUsed = Date.now(); div.dataset.pid = pid; inp.value = p.name;
        div.querySelector('.l-unit').textContent = p.unitName;
        save();
      }
    },
    onCreate: (q)=>{ if(q) showAddProduct(q, div); }
  });
}
function delLine(btn){
  const box = btn.closest('.line-row');
  box.remove();
  if(!document.querySelectorAll('.line-row').length) addLine();
}
function setLineUnit(btn, u){
  const seg = btn.parentElement;
  seg.querySelector('.l-case').classList.toggle('on', u==='case');
  seg.querySelector('.l-unit').classList.toggle('on', u==='unit');
}

function setType(t){
  type = t;
  ['in','out','back'].forEach(k=>{
    document.getElementById('b-'+k).className = k===t ? 'on-'+k : '';
  });
  document.getElementById('custRow').style.display = (t==='out') ? '' : 'none';
  if(t!=='out'){ cInput.value=''; selCustomer=null; }
  updateHint();
}
function updateHint(){
  document.getElementById('typeHint').textContent =
    type==='in' ? '💡 拿货单：默认按件，散装可切零头。多行一次入账' :
    type==='back' ? '💡 退仓单：货退回仓库，从车上结余里扣掉。整件/零包都行' :
    '💡 卖出单：选客户 + 多行产品，一次入账。默认按件，可切零头';
}

function submitOrder(){
  const dateVal = document.getElementById('fDate').value;
  if(!dateVal) return alert('请选日期');
  // 客户（卖出必填）
  let custId = null, custName = '';
  if(type==='out'){
    if(!selCustomer && cInput.value.trim()) useCustomer(cInput.value.trim());
    if(!selCustomer) return alert('卖出单请先选/输客户');
    custId = selCustomer.id;
    const c = state.customers.find(x=>x.id===custId); custName = c ? c.name : '';
  }
  // 收集明细行：无效行（半填/小数）先列出，确认后才跳过
  const rows = [], bad = [];
  document.querySelectorAll('#lines .line-row').forEach((div,i)=>{
    const p = state.products.find(x=>x.id===div.dataset.pid);
    const raw = div.querySelector('.l-qty').value.trim();
    if(!p && !raw) return; // 全空行静默忽略
    if(!p){ bad.push('第'+(i+1)+'行：填了数量没选产品'); return; }
    if(!raw || !/^\d+$/.test(raw) || parseInt(raw)<1){ bad.push('第'+(i+1)+'行：数量须填正整数（当前"'+(raw||'空')+'"）'); return; }
    const qty = parseInt(raw);
    const unit = div.querySelector('.l-unit').classList.contains('on') ? 'unit' : 'case';
    let units = qty, label;
    if(unit==='case'){ units = qty * p.perCase; label = qty+'件'+(type!=='in'?'（='+units+p.unitName+'）':''); }
    else { units = qty; label = fmtStock(qty, p); } // 零头凑成整件时自动显示为"X件"
    rows.push({ p, units, label });
  });
  if(bad.length){
    if(!confirm('以下 '+bad.length+' 行有问题，将跳过不记：\n\n'+bad.join('\n')+'\n\n确定跳过并记其余行？（取消=回去修改）')) return;
  }
  if(!rows.length) return alert('没有有效明细行（产品+数量）');

  if(type==='out' || type==='back'){
    for(const r of rows){
      if(r.units > stockOf(r.p.id)){
        if(!confirm('⚠️ '+r.p.name+(type==='out'?' 卖出':' 退仓')+'大于当前结余（'+fmtStock(stockOf(r.p.id),r.p)+'），确定没记错？')) return;
      }
    }
  }

  const orderId = 'o' + Date.now();
  const now = new Date().toLocaleString('zh-CN',{hour12:false});
  const newRecs = rows.map(r=>({ id:nid(), pid:r.p.id, type, label:r.label, qty:r.units, note:'',
    custId, custName, orderId, odate:dateVal, time:now }));
  newRecs.reverse(); // 逐条 unshift 后保持输入顺序
  newRecs.forEach(r=>state.records.unshift(r));
  save();
  // 重置表单
  document.getElementById('fDate').value = todayStr();
  cInput.value=''; selCustomer=null;
  document.getElementById('lines').innerHTML='';
  addLine();
  render();
  toast('✅ 已记 1 张单（'+rows.length+' 行）');
}

function delOrder(oid){
  if(!confirm('删除整张单（含全部明细）？')) return;
  state.records = state.records.filter(r=>String(r.orderId||'')!==String(oid));
  save(); render(); renderOrders();
}

/* ---------- 修改单据 ---------- */
const eCInput = document.getElementById('eCust'), eCList = document.getElementById('eAcCust');
let eSelCust = null, eType = 'in', editKey = null, editTime = '', editNotes = {};
function useEditCustomer(name){
  let c = state.customers.find(x=>x.name===name);
  if(!c){ c = { id:'c'+Date.now(), name, lastUsed:Date.now() }; state.customers.push(c); save(); }
  eSelCust = c; eCInput.value = name;
}
bindAC(eCInput, eCList, ()=>state.customers, {
  itemHtml: c=>`🏪 ${c.name}`,
  createHtml: q=>`➕ 使用新客户「${q}」`,
  emptyText: '输入名字自动记住',
  onEdit: ()=>{ eSelCust = null; },
  onPick: (id)=>{
    eSelCust = state.customers.find(c=>c.id===id);
    if(eSelCust){ eSelCust.lastUsed = Date.now(); eCInput.value = eSelCust.name; save(); }
  },
  onCreate: q=>{ if(q) useEditCustomer(q); }
});

function openEditOrder(key){
  const recs = state.records.filter(r => (r.orderId || ('solo_'+r.id)) === key);
  if(!recs.length) return;
  editKey = key; editTime = recs[0].time || '';
  editNotes = {}; recs.forEach(r=>{ editNotes[r.pid] = r.note || ''; });
  eType = recs[0].type;
  document.getElementById('eTitle').textContent = '✏️ 修改' + (TYPE_NAME[eType] || '单据');
  document.getElementById('eDate').value = toKey(recs[0]) || todayStr();
  document.getElementById('eCustRow').style.display = (eType==='out') ? '' : 'none';
  eSelCust = null; eCInput.value = '';
  const cRec = recs.find(r=>r.custId);
  if(cRec && eType==='out'){
    const c = state.customers.find(x=>x.id===cRec.custId);
    if(c){ eSelCust = c; eCInput.value = c.name; }
  }
  const box = document.getElementById('eLines'); box.innerHTML = '';
  recs.forEach(r=>eAddLine(r));
  dlgEdit.showModal();
}

function eAddLine(rec){

  div.innerHTML = `
    <div class="r1">
      <div class="ac-wrap">
        <input type="text" class="l-prod" placeholder="产品：输入名字选择" autocomplete="off" style="width:100%">
        <div class="ac-list hidden"></div>
      </div>
      <span class="l-del" onclick="eDelLine(this)">✕</span>
    </div>
    <div class="r2">
      <input type="number" class="l-qty" min="1" placeholder="数量" inputmode="numeric">
      <div class="unit-seg">
        <button type="button" class="l-case on" onclick="setLineUnit(this,'case')">件</button>
        <button type="button" class="l-unit" onclick="setLineUnit(this,'unit')">包</button>
      </div>
    </div>`;
  document.getElementById('eLines').appendChild(div);
  const pInput = div.querySelector('.l-prod'), pList = div.querySelector('.ac-list');
  bindAC(pInput, pList, ()=>state.products, {
    itemHtml: p=>`${p.name} <small>1件=${p.perCase}${p.unitName}</small>`,

    emptyText: '输入名称即可新增',
    onEdit: ()=>{ div.dataset.pid = ''; },
    onPick: (pid, inp)=>{
      const p = state.products.find(x=>x.id===pid);
      if(p){ p.lastUsed = Date.now(); div.dataset.pid = pid; inp.value = p.name;
        div.querySelector('.l-unit').textContent = p.unitName; save(); }
    },
    onCreate: (q)=>{ if(q) showAddProduct(q, div); }
  });
  if(rec){
    const p = state.products.find(x=>x.id===rec.pid);
    if(p){
      div.dataset.pid = p.id; pInput.value = p.name;
      div.querySelector('.l-unit').textContent = p.unitName;
      if(rec.qty % p.perCase === 0) div.querySelector('.l-qty').value = rec.qty / p.perCase;
      else { div.querySelector('.l-qty').value = rec.qty; setLineUnit(div.querySelector('.l-unit'), 'unit'); }
    } else div.querySelector('.l-qty').value = rec.qty;

}
function eDelLine(btn){ btn.closest('.line-row').remove(); }

// 改单时的结余校验：排除这张单自己的量，避免自己跟自己比
function stockOfExcluding(pid, key){
  let q = 0;
  state.records.forEach(r=>{
    if(r.pid!==pid || (r.orderId||('solo_'+r.id))===key) return;
    q += (r.type==='out'||r.type==='pout'||r.type==='back') ? -r.qty : r.qty;
  });
  return q;
}

function saveEditOrder(){
  const dateVal = document.getElementById('eDate').value;
  if(!dateVal) return alert('请选日期');
  let custId = null, custName = '';
  if(eType==='out'){
    if(!eSelCust && eCInput.value.trim()) useEditCustomer(eCInput.value.trim());
    if(!eSelCust) return alert('卖出单请先选/输客户');
    custId = eSelCust.id; custName = eSelCust.name;
  }
  const rows = [], bad = [];
  document.querySelectorAll('#eLines .line-row').forEach((div,i)=>{
    const p = state.products.find(x=>x.id===div.dataset.pid);
    const raw = div.querySelector('.l-qty').value.trim();
    if(!p && !raw) return;
    if(!p){ bad.push('第'+(i+1)+'行：填了数量没选产品'); return; }
    if(!raw || !/^\d+$/.test(raw) || parseInt(raw)<1){ bad.push('第'+(i+1)+'行：数量须填正整数'); return; }
    const qty = parseInt(raw);
    const unit = div.querySelector('.l-unit').classList.contains('on') ? 'unit' : 'case';
    let units = qty, label;
    if(unit==='case'){ units = qty * p.perCase; label = qty+'件'+(eType!=='in'?'（='+units+p.unitName+'）':''); }
    else { units = qty; label = fmtStock(qty, p); }
    rows.push({ p, units, label });
  });
  if(bad.length){
    if(!confirm('以下 '+bad.length+' 行有问题，将跳过不记：\n\n'+bad.join('\n')+'\n\n确定？（取消=回去修改）')) return;
  }
  if(!rows.length) return alert('没有有效明细行');
  if(eType==='out' || eType==='back'){
    for(const r of rows){
      if(r.units > stockOfExcluding(r.p.id, editKey)){
        if(!confirm('⚠️ '+r.p.name+' 改完后超出当前结余，确定没记错？')) return;
      }
    }
  }
  state.records = state.records.filter(r => (r.orderId || ('solo_'+r.id)) !== editKey);
  const oid = editKey.startsWith('solo_') ? ('o'+Date.now()) : editKey;
  const newRecs = rows.map(r=>({ id:nid(), pid:r.p.id, type:eType, label:r.label, qty:r.units,
    note: editNotes[r.p.id] || '', custId, custName, orderId:oid, odate:dateVal,
    time: editTime || new Date().toLocaleString('zh-CN',{hour12:false}) }));
  newRecs.reverse();
  newRecs.forEach(r=>state.records.unshift(r));
  save(); dlgEdit.close(); render();
  toast('✅ 单据已改');
}

/* ---------- 结余/流水渲染 ---------- */
function stockOf(pid){
  let q = 0;
  state.records.forEach(r=>{
    if(r.pid!==pid) return;
    q += (r.type==='out' || r.type==='pout' || r.type==='back') ? -r.qty : r.qty;
  });
  return q;
}
function fmtStock(units, p){
  if(!p) return units;
  if(units===0) return '—';
  const cases = Math.floor(units / p.perCase), left = units % p.perCase;
  if(cases===0) return left + p.unitName;
  return cases + '件' + (left ? '零' + left + p.unitName : '');
}
function custNameOf(r){
  if(r.custId){
    const c = state.customers.find(x=>x.id===r.custId);
    return c ? c.name : (r.custName || '');
  }
  return '';
}
function orderCardsHTML(records){
  // 按 orderId 分组（老记录无 orderId 时按日期+类型聚合不了，逐条成卡）
  const groups = [];
  const idx = {};
  records.forEach(r=>{
    const k = r.orderId || ('solo_'+r.id);
    if(idx[k]===undefined){ idx[k] = groups.length; groups.push({ key:k, head:null, rows:[] }); }
    const g = groups[idx[k]];
    g.rows.push(r);
    if(!g.head) g.head = r; // 组内第一条（unshift 所以为最早提交但展示用其信息）
  });
  return groups.map(g=>{
    const h = g.head;
    const who = h.type==='in' ? '' : (h.type==='out' ? ('🏪 '+(custNameOf(h)||'（未记客户）')) : TYPE_NAME[h.type]);
    const neg = g.rows.every(r=>r.type==='out'||r.type==='pout'||r.type==='back');
    const pos = g.rows.every(r=>r.type==='in'||r.type==='ret'||r.type==='pin');
    const lines = g.rows.map(r=>{
      const p = state.products.find(x=>x.id===r.pid);
      const n = (r.type==='out'||r.type==='pout');
      return `<div class="order-line"><span>${p?p.name:'(已删产品)'}</span>
        <span class="amt ${n?'neg':'pos'}">${n?'−':'+'}${r.label}</span></div>`;
    }).join('');
    const delBtn = r => r.orderId ? `<span class="del" onclick="event.stopPropagation();delOrder('${r.orderId}')">🗑</span>` : '';
    return `<div class="order-card" onclick="openEditOrder('${g.key}')">
      <div class="order-head">
        <span><span class="tag ${TYPE_TAG[h.type]}">${TYPE_NAME[h.type]}</span><span class="who">${who}</span></span>
        <span class="dt">${fmtDateKey(toKey(h))} ${delBtn(h)}</span>
      </div>${lines}
    </div>`;
  }).join('');
}

function showAddProduct(name, lineDiv){
  document.getElementById('newName').value = name||'';
  document.getElementById('newPer').value=''; document.getElementById('newUnit').value='';
  window._pendingLine = lineDiv || null;
  dlgProduct.showModal();
}
function addProduct(){
  const n = document.getElementById('newName').value.trim();
  const per = parseInt(document.getElementById('newPer').value);
  const u = document.getElementById('newUnit').value.trim() || '包';
  if(!n) return alert('请填产品名称');
  // 查重：已有同名产品直接复用，避免重复产品拆分结余
  const exist = state.products.find(p=>p.name===n);
  if(exist){
    if(!confirm('已有产品「'+n+'」（1件='+exist.perCase+exist.unitName+'），直接选用它？')) return;
    dlgProduct.close();
    const div = window._pendingLine || document.querySelector('#lines .line-row:last-child');
    if(div){
      div.dataset.pid = exist.id;
      div.querySelector('.l-prod').value = exist.name;
      div.querySelector('.l-unit').textContent = exist.unitName;
    }
    window._pendingLine = null;
    toast('已选用现有产品「'+n+'」');
    return;
  }
  if(!per || per<1) return alert('请填每件数量（如30）');
  state.products.push({ id:'p'+Date.now(), name:n, perCase:per, unitName:u, lastUsed:Date.now() });
  save(); dlgProduct.close(); render();
  // 新增后回填到来源行（或新增一行）
  const div = window._pendingLine || document.querySelector('#lines .line-row:last-child');
  if(div){
    const p = state.products[state.products.length-1];
    div.dataset.pid = p.id;
    div.querySelector('.l-prod').value = p.name;
    div.querySelector('.l-unit').textContent = p.unitName;
  }
  window._pendingLine = null;
}
function delProduct(pid){
  if(state.records.some(r=>r.pid===pid)) return alert('该产品已有流水记录，不能删（否则历史账会乱）');
  if(!confirm('删除产品？')) return;
  state.products = state.products.filter(p=>p.id!==pid);
  save(); render();
}
function delCustomer(cid){
  if(state.records.some(r=>r.custId===cid)) return alert('该客户已有流水记录，不能删');
  if(!confirm('删除客户？')) return;
  state.customers = state.customers.filter(c=>c.id!==cid);
  if(selCustomer && selCustomer.id===cid){ selCustomer=null; cInput.value=''; }
  save(); render();
}

function render(){
  const sl = document.getElementById('stockList');
  if(!state.products.length){ sl.innerHTML = '<div class="empty">还没有产品，记单时输入产品名即可新增</div>'; }
  else sl.innerHTML = state.products.map(p=>{
    const q = stockOf(p.id);
    return `<div class="stock-row">
      <span>${p.name} <span style="color:#bbb;font-size:12px" onclick="delProduct('${p.id}')">✕</span></span>
      <span class="qty ${q>0?'pos':(q<0?'neg':'zero')}">${q>0?fmtStock(q,p):(q<0?'超 '+fmtStock(-q,p):'0')}
        <small>${q>0?('共'+q+p.unitName):''}</small></span>
    </div>`;
  }).join('');

  // 最近单据速览：最近 4 组（单）
  const seen = {};
  let cnt = 0;
  for(const r of state.records){
    const k = r.orderId || ('solo_'+r.id);
    if(!seen[k]){ seen[k]=1; if(++cnt>=4) break; }
  }
  const recs = state.records.filter(r=>seen[r.orderId || ('solo_'+r.id)]).slice(0, 40);
  const rl = document.getElementById('recList');
  rl.innerHTML = recs.length ? orderCardsHTML(recs) : '<div class="empty">暂无单据</div>';

  updateHint();
  if(!document.getElementById('page-sum').classList.contains('hidden')){ renderSum(); renderCustSum(); }
  if(!document.getElementById('page-pan').classList.contains('hidden')) renderPan();
  if(!document.getElementById('page-find').classList.contains('hidden')) renderOrders();
}

/* ---------- 查单 ---------- */
function renderOrders(){
  const el = document.getElementById('orderList');
  if(!state.records.length){ el.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  const q = document.getElementById('qDate').value;
  if(!q){ el.innerHTML = '<div class="empty">上面选个日期，看那天拿了/卖了什么</div>'; return; }
  const recs = state.records.filter(r=>toKey(r)===q);
  el.innerHTML = recs.length ? orderCardsHTML(recs) : '<div class="empty">'+fmtDateKey(q)+' 没有单据</div>';
}

/* ---------- 汇总 ---------- */
function renderSum(){
  const hasRet = state.records.some(r=>r.type==='ret');
  const hasBack = state.records.some(r=>r.type==='back');
  document.getElementById('sumHead').innerHTML = '<tr><th>产品</th><th>拿货</th><th>卖出</th>'+(hasRet?'<th>退货</th>':'')+(hasBack?'<th>退仓</th>':'')+'<th>盘点±</th><th>车上应有</th></tr>';
  document.getElementById('sumBody').innerHTML = state.products.map(p=>{
    let tin=0,tout=0,tret=0,tpan=0,tback=0;
    state.records.forEach(r=>{
      if(r.pid!==p.id) return;
      if(r.type==='in') tin+=r.qty;
      else if(r.type==='out') tout+=r.qty;
      else if(r.type==='ret') tret+=r.qty;
      else if(r.type==='back') tback+=r.qty;
      else if(r.type==='pin') tpan+=r.qty;
      else if(r.type==='pout') tpan-=r.qty;
    });
    const bal = tin-tout-tback+tret+tpan;
    return `<tr><td>${p.name}</td><td>${fmtStock(tin,p)}</td><td>${fmtStock(tout,p)}</td>${hasRet?('<td>'+fmtStock(tret,p)+'</td>'):''}${hasBack?('<td>'+fmtStock(tback,p)+'</td>'):''}<td>${tpan>0?'+'+fmtStock(tpan,p):(tpan<0?'−'+fmtStock(-tpan,p):'—')}</td><td><b>${fmtStock(bal,p)}</b></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
}

function renderCustSum(){
  const map = {};
  state.records.forEach(r=>{
    if(r.type!=='out' && r.type!=='ret') return;
    const k = r.custId || '__none__';
    (map[k] = map[k]||{})[r.pid] = (map[k][r.pid]||0) + (r.type==='out' ? r.qty : -r.qty);
  });
  const keys = Object.keys(map);
  document.getElementById('custBody').innerHTML = keys.length ? keys.map(k=>{
    let name = '未记客户';
    if(k!=='__none__'){
      const c = state.customers.find(x=>x.id===k);
      if(!c) return '';
      name = `${c.name} <span style="color:#bbb;font-size:12px" onclick="delCustomer('${c.id}')">✕</span>`;
    }
    const detail = Object.keys(map[k]).map(pid=>{
      const p = state.products.find(x=>x.id===pid);
      const q = map[k][pid];
      return `${p?p.name:'?'} ${q>=0?fmtStock(q,p):fmtStock(Math.abs(q),p)+'（退多）'}`;
    }).join('<br>');
    return `<tr><td>${name}</td><td class="cust-detail">${detail}</td></tr>`;
  }).join('') : '<tr><td colspan="2" class="empty">暂无客户流水</td></tr>';
}

/* ---------- 盘点 ---------- */
let panMode = 'input';
let panEntries = {};
let panResult = [];

function panInp(pid, k, v){ (panEntries[pid] = panEntries[pid]||{c:'',l:''})[k] = v; }

function renderPan(){
  const el = document.getElementById('panPanel');
  if(panMode==='input'){
    el.innerHTML = `<h3>🔄 盘点：清点车上实货</h3>
      <div class="hint" style="margin-bottom:10px">💡 逐个产品数车上的实数填进去（只填件也行），没盘到的产品留空跳过。填完点「对比」。</div>` +
      (state.products.length ? state.products.map(p=>{
        const e = panEntries[p.id]||{c:'',l:''};
        return `<div class="pan-row">
          <div class="pan-head"><b>${p.name}</b><span class="exp">账面应有 ${fmtStock(stockOf(p.id),p)}</span></div>
          <div class="pan-inp">
            <input type="number" min="0" inputmode="numeric" placeholder="件" value="${e.c}" oninput="panInp('${p.id}','c',this.value)"> 件
            零 <input type="number" min="0" inputmode="numeric" placeholder="${p.unitName}" value="${e.l}" oninput="panInp('${p.id}','l',this.value)"> ${p.unitName}
          </div>
        </div>`;
      }).join('') : '<div class="empty">还没有产品，先去记单页新增</div>') +
      `<div class="pan-btns"><button class="btn-fix" style="background:#2563eb" onclick="panCompare()">🔍 对比</button></div>`;
  }else{
    let nOk=0, nBad=0, nMore=0;
    panResult.forEach(r=>{ if(r.diff===0)nOk++; else if(r.diff<0)nBad++; else nMore++; });
    el.innerHTML = `<h3>🔄 盘点结果</h3>
      <div class="stat-bar"><span>🟢 一致 ${nOk}</span><span style="color:#c0392b">🔴 少 ${nBad}</span><span style="color:#b8860b">🟡 多 ${nMore}</span></div>` +
      panResult.map(r=>{
        const p = r.p;
        let cls, txt;
        if(r.diff===0){ cls='ok'; txt='✅ 一致'; }
        else if(r.diff<0){ cls='bad'; txt='🔴 少 '+fmtStock(-r.diff,p); }
        else{ cls='more'; txt='🟡 多 '+fmtStock(r.diff,p); }
        return `<div class="res-row ${cls}">
          <div><b>${p.name}</b><div class="info">应有 ${fmtStock(r.exp,p)} · 实盘 ${fmtStock(r.act,p)}</div></div>
          <span class="diff">${txt}</span>
        </div>`;
      }).join('') +
      `<div class="hint" style="margin-top:8px">🔴 少了：可能漏记卖出或丢货；🟡 多了：可能漏记拿货。</div>
      <div class="pan-btns">
        <button class="btn-back" onclick="panBackEdit()">返回修改</button>
        <button class="btn-fix" onclick="panFix()">💊 一键补账拉平</button>
      </div>
      <div class="pan-btns"><button class="btn-redo" onclick="panReset()">🔄 重新盘点</button></div>`;
  }
}

function panCompare(){
  const rows = [];
  state.products.forEach(p=>{
    const e = panEntries[p.id];
    if(!e || (e.c==='' && e.l==='')) return;
    const act = (parseInt(e.c)||0)*p.perCase + (parseInt(e.l)||0);
    rows.push({ p, act, exp: stockOf(p.id), diff: act-stockOf(p.id) });
  });
  if(!rows.length) return alert('先填至少一个产品的实盘数');
  panResult = rows; panMode = 'result'; renderPan();
}

function panBackEdit(){ panMode='input'; renderPan(); }
function panReset(){ panEntries={}; panResult=[]; panMode='input'; renderPan(); }

function panFix(){
  // 复核：以当前实盘输入 + 当前库存实时重算差异（防对比之后又记过账导致补错）
  const diffs = [];
  state.products.forEach(p=>{
    const e = panEntries[p.id];
    if(!e || (e.c==='' && e.l==='')) return;
    const act = (parseInt(e.c)||0)*p.perCase + (parseInt(e.l)||0);
    const diff = act - stockOf(p.id);
    if(diff!==0) diffs.push({ p, diff });
  });
  if(!diffs.length){ toast('当前全部一致，无需补账'); panReset(); return; }
  const summary = diffs.map(r=>
    `${r.p.name} ${r.diff<0?'少':'多'} ${fmtStock(Math.abs(r.diff),r.p)} → 补记${r.diff<0?'盘亏':'盘盈'}`
  ).join('\n');
  if(!confirm('将自动补记以下流水，把账面拉到实盘数：\n\n'+summary+'\n\n确认补账？')) return;
  const t = new Date().toLocaleString('zh-CN',{hour12:false});
  diffs.forEach(r=>{
    const abs = Math.abs(r.diff);
    state.records.unshift({
      id:nid(), pid:r.p.id,
      type: r.diff<0 ? 'pout' : 'pin',
      label: fmtStock(abs, r.p), qty: abs,
      note: '盘点修正', time: t
    });
  });
  save(); panReset(); render();
  toast('已补账，账实拉平 ✅');
}

/* ---------- 导出导入 ---------- */
function exportCSV(){
  if(!state.records.length) return alert('暂无流水');
  let csv = '\uFEFF日期,产品,类型,数量,折合,客户,备注,时间\n';
  state.records.forEach(r=>{
    const p = state.products.find(x=>x.id===r.pid);
    csv += `"${fmtDateKey(toKey(r))}","${p?p.name:''}","${TYPE_NAME[r.type]}","${r.label}","${r.qty}${p?p.unitName:''}","${custNameOf(r)}","${(r.note||'').replace(/"/g,'""')}","${r.time}"\n`;
  });
  dl(new Blob([csv],{type:'text/csv'}), '存货流水_'+new Date().toISOString().slice(0,10)+'.csv');
}
function exportData(){ dl(new Blob([JSON.stringify(state)],{type:'application/json'}), '车上存货备份_'+new Date().toISOString().slice(0,10)+'.json'); state.backupAt = Date.now(); save(); renderBackupBar(); }
function dl(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!d.products || !d.records) throw 0;
      if(!d.customers) d.customers = [];
      if(!confirm('导入会覆盖当前所有数据，继续？')) return;
      state = d; if(!state.backupAt) state.backupAt = Date.now(); save(); render(); toast('导入成功'); renderBackupBar();
    }catch(e){ alert('文件格式不对'); }
  };
  rd.readAsText(f); inp.value='';
}

document.getElementById('fDate').value = todayStr();
document.getElementById('qDate').value = todayStr();
if(!state.backupAt){ state.backupAt = Date.now(); save(); } // 首次静默起算，7天后开始提醒备份
setType('in'); addLine(); render(); renderBackupBar();
</script>
